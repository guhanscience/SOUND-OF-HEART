<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Sound of Heart</title>
    <link rel="icon" href="Sound of Heart Logo.png">
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="bg-glow"></div>

    <main class="login-page">

        <div class="login-card">

            <a
                href="index.html"
                class="logo"
            >
                Sound of <span>Heart</span>
            </a>


            <div class="login-heading">

                <p class="section-tag">
                    Welcome Back
                </p>

                <h1>
                    Sign in to your account
                </h1>

                <p>
                    Access your repair requests
                    and stay connected with
                    Sound of Heart.
                </p>

            </div>


            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Sign In
                </button>


                <p
                    id="loginMessage"
                    class="login-message"
                ></p>

            </form>


            <div class="divider">
                <span>or</span>
            </div>


            <p class="signup-text">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Sound of Heart
            </a>

        </div>

    </main>


    <script src="login.js"></script>

</body>

</html>
