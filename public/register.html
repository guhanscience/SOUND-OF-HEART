<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | Sound of Heart</title>
    <link rel="icon" type="image/png" href="/Sound of Heart Logo.png">
    <link rel="stylesheet" href="login.css">

</head>

<body>

    <div class="bg-glow"></div>

    <main class="login-page">

        <div class="login-card">

            <a
                href="index.html"
                class="logo"
            >
                Sound of <span>Heart</span>
            </a>


            <div class="login-heading">

                <p class="section-tag">
                    Get Started
                </p>

                <h1>
                    Create your account
                </h1>

                <p>
                    Create an account to manage
                    your speaker repair requests.
                </p>

            </div>


            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Repeat your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="login-message"
                ></p>

            </form>


            <div class="divider">
                <span>or</span>
            </div>


            <p class="signup-text">

                Already have an account?

                <a href="login.html">
                    Sign in
                </a>

            </p>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Sound of Heart
            </a>

        </div>

    </main>


    <script src="register.js"></script>

</body>

</html>
